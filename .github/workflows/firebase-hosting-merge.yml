name: Deploy to Firebase Hosting Live
on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install Dependencies
        working-directory: ./website
        run: npm ci

      - name: Build and Export Static Site
        working-directory: ./website
        run: npm run build

      - name: Deploy to Firebase Hosting Live Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAPIDOINFR || secrets.FIREBASE_SERVICE_ACCOUNT_RAPIDO_INFR || secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: rapidoinfr
          channelId: live
