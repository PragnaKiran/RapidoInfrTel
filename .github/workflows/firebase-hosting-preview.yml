name: Deploy to Firebase Hosting Preview
on:
  pull_request:
  push:
    branches:
      - dev
      - demo
  workflow_dispatch:
    inputs:
      channelId:
        description: 'Target preview channel (default: preview)'
        required: false
        default: 'preview'

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install Dependencies
        working-directory: ./website
        run: npm ci

      - name: Build and Export Static Site
        working-directory: ./website
        run: npm run build

      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAPIDOINFR || secrets.FIREBASE_SERVICE_ACCOUNT_RAPIDO_INFR || secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: rapidoinfr
          channelId: ${{ github.event.inputs.channelId || (github.event_name == 'pull_request' && '' || 'preview') }}
